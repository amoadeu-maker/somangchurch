<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소망교회</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="소망교회">
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#2b2a28;--sub:#78746c;--line:#e6e0d4;--main:#2f5d50;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1b1c1a;--card:#262826;--ink:#efece4;--sub:#a7a398;--line:#383a36;--main:#7fb5a3;--on:#14201c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.7;font-size:17px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;padding:18px 0 22px}
header small{color:var(--sub);font-size:14px}
header h1{margin:4px 0 0;font-size:30px;color:var(--main)}
.tile,.post{display:flex;align-items:center;gap:16px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-bottom:14px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.post{display:block;border-radius:14px;padding:14px 16px;margin-bottom:10px}
.tile .ic{font-size:34px}.tile b{display:block;font-size:21px}.tile span,.post span,.date{color:var(--sub);font-size:14px}
.post b{display:block;font-size:17px}
.top{margin-bottom:10px}.back{background:none;border:0;font:inherit;color:var(--main);cursor:pointer;padding:8px 4px}
h2{margin:0 0 14px;font-size:23px}
.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.detail h3{margin:0 0 4px;font-size:20px}.detail p{white-space:pre-wrap;margin:14px 0}
.btn{display:inline-block;background:var(--main);color:var(--on);text-decoration:none;padding:12px 18px;border-radius:10px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
</style></head><body><div class="wrap" id="app"></div>
<script src="data.js"></script>
<script>
var S={jubo:{n:"주보",i:"📖",s:"이번 주 주보",p:JUBO},sedo:{n:"성서일과",i:"✝️",s:"주일 말씀 본문",p:SEDO},edu:{n:"성서교육",i:"🌱",s:"새신자 교육 및 공부 자료",p:EDU}};
var app=document.getElementById("app");
function e(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){var q=(location.hash||"").slice(1).split("-"),c=S[q[0]],o="";
if(!c){o='<header><small>기독교대한감리회</small><h1>소망교회</h1></header>';for(var k in S)o+='<button class="tile" onclick="location.hash=\''+k+'\'"><div class="ic">'+S[k].i+'</div><div><b>'+S[k].n+'</b><span>'+S[k].s+'</span></div></button>';}
else if(q[1]===undefined){o='<div class="top"><button class="back" onclick="location.hash=\'\'">← 처음</button></div><h2>'+c.i+' '+c.n+'</h2>';
if(!c.p.length)o+='<div class="empty">아직 올라온 글이 없습니다.</div>';
c.p.forEach(function(x,i){o+='<button class="post" onclick="location.hash=\''+q[0]+'-'+i+'\'"><b>'+e(x.t)+'</b><span>'+e(x.d)+'</span></button>'});}
else{var x=c.p[+q[1]];if(!x){location.hash=q[0];return}
o='<div class="top"><button class="back" onclick="location.hash=\''+q[0]+'\'">← '+c.n+'</button></div><div class="detail"><h3>'+e(x.t)+'</h3><span class="date">'+e(x.d)+'</span><p>'+e(x.body)+'</p>'+(x.link?'<a class="btn" href="'+e(x.link)+'" target="_blank">원본 PDF 열기</a>':'')+'</div>';}
app.innerHTML=o;scrollTo(0,0)}
addEventListener("hashchange",render);render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
